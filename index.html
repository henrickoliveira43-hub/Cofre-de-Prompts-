<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PromptVault — Cofre Pessoal de Prompts v2.4</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    --header-height: clamp(65px, 8vh, 75px);
    --container-width: min(92%, 1120px);
    --card-grid-cols: 1fr;

    --radius-lg: 16px;
    --radius: 10px;
    --radius-sm: 6px;
  }

  [data-theme="dark"] {
    --bg: #050807;
    --panel: rgba(13, 20, 16, 0.9);
    --panel-border: rgba(212, 175, 55, 0.22);
    --panel-card: rgba(18, 28, 23, 0.75);
    --hairline: rgba(201, 169, 97, 0.18);
    --hairline-hover: rgba(212, 175, 55, 0.5);
    
    --brass: #d4af37;
    --brass-bright: #f5e6b3;
    --brass-dim: #6b5728;
    --brass-glow: rgba(212, 175, 55, 0.25);
    
    --text: #f3efe6;
    --text-dim: #a0acLine;
    --text-dim-color: #93a098;
    --text-placeholder: #5c6660;
    
    --teal: #4db6ac;
    --teal-bg: rgba(77, 182, 172, 0.12);
    --danger: #e57373;
    --danger-bg: rgba(229, 115, 115, 0.12);
    --warning: #ffb74d;
    --warning-bg: rgba(255, 183, 77, 0.12);
    
    --shadow-main: 0 20px 40px rgba(0, 0, 0, 0.85);
    --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.5);
    --bg-gradient: radial-gradient(1000px 600px at 50% -10%, rgba(212, 175, 55, 0.12), transparent 70%),
                   radial-gradient(800px 500px at 90% 90%, rgba(77, 182, 172, 0.05), transparent 60%),
                   var(--bg);
    --input-bg: rgba(0, 0, 0, 0.5);
    --input-focus-bg: rgba(0, 0, 0, 0.75);
    --code-bg: rgba(0, 0, 0, 0.45);
  }

  [data-theme="light"] {
    --bg: #f6f4ef;
    --panel: rgba(255, 255, 255, 0.95);
    --panel-border: rgba(184, 148, 45, 0.3);
    --panel-card: #ffffff;
    --hairline: rgba(184, 148, 45, 0.22);
    --hairline-hover: rgba(184, 148, 45, 0.65);
    
    --brass: #9e7b12;
    --brass-bright: #b8942d;
    --brass-dim: #d4af37;
    --brass-glow: rgba(184, 148, 45, 0.18);
    
    --text: #1a211d;
    --text-dim-color: #556059;
    --text-placeholder: #8d9690;
    
    --teal: #00796b;
    --teal-bg: rgba(0, 121, 107, 0.1);
    --danger: #d32f2f;
    --danger-bg: rgba(211, 47, 47, 0.1);
    --warning: #e65100;
    --warning-bg: rgba(230, 81, 0, 0.1);
    
    --shadow-main: 0 16px 36px rgba(0, 0, 0, 0.06);
    --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.04);
    --bg-gradient: radial-gradient(1000px 600px at 50% -10%, rgba(212, 175, 55, 0.15), transparent 70%),
                   radial-gradient(800px 500px at 90% 90%, rgba(77, 182, 172, 0.08), transparent 60%),
                   var(--bg);
    --input-bg: #ffffff;
    --input-focus-bg: #ffffff;
    --code-bg: rgba(0, 0, 0, 0.03);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-gradient);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    padding-top: var(--header-height);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  ::selection { background: var(--brass); color: #050807; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* HEADER PERFEITAMENTE ALINHADO */
  header {
    position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(16px, 4vw, 40px);
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--hairline);
    z-index: 1000;
  }
  
  .brand { display: flex; align-items: center; gap: 12px; }
  
  .dial {
    width: 36px; height: 36px;
    border-radius: 50%; border: 2px solid var(--brass);
    position: relative;
    background: radial-gradient(circle at 35% 30%, #1d3027, var(--bg) 80%);
    box-shadow: 0 0 12px var(--brass-glow);
    flex-shrink: 0;
  }
  .dial::before {
    content: ''; position: absolute; inset: 3px; border-radius: 50%;
    border: 1px dashed var(--brass-bright); opacity: 0.6;
  }
  .dial::after {
    content: ''; position: absolute; top: 3px; left: 50%;
    width: 2px; height: 7px; background: var(--brass-bright);
    transform: translateX(-50%); border-radius: 2px;
  }

  .wordmark { 
    font-family: 'Fraunces', serif; font-weight: 700; 
    font-size: clamp(1.1rem, 2.2vw, 1.35rem); letter-spacing: .02em; white-space: nowrap;
  }
  .wordmark span { color: var(--brass); font-style: italic; font-weight: 300; }
  
  .header-controls { display: flex; align-items: center; gap: 8px; }

  .theme-toggle-btn {
    background: var(--input-bg); border: 1px solid var(--hairline); color: var(--text);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: var(--transition); font-size: .9rem;
  }
  .theme-toggle-btn:hover { border-color: var(--brass); color: var(--brass); transform: scale(1.05); }

  .mode-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; padding: 4px 10px;
    border-radius: 20px; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; border: 1px solid var(--hairline);
  }
  .mode-badge.cloud { color: var(--teal); background: var(--teal-bg); }
  .mode-badge.local { color: var(--warning); background: var(--warning-bg); }
  .mode-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .mode-badge.cloud::before { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .mode-badge.local::before { background: var(--warning); box-shadow: 0 0 6px var(--warning); }

  .entry-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text);
    background: var(--input-bg); border: 1px solid var(--hairline); padding: 4px 10px;
    border-radius: 20px; white-space: nowrap;
  }

  .main-wrapper {
    width: var(--container-width); margin: 0 auto; padding: 28px 0 80px;
  }

  .eyebrow-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace; font-size: .75rem; letter-spacing: .18em;
    color: var(--brass); text-transform: uppercase; margin: 0; font-weight: 600;
  }

  /* FORMULÁRIO DE CADASTRO MELHORADO */
  .form-container {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border); border-radius: var(--radius-lg);
    padding: clamp(18px, 3.5vw, 30px); margin-bottom: 36px; box-shadow: var(--shadow-main);
    position: relative; transition: var(--transition);
  }
  .form-container::before {
    content: ''; position: absolute; top: 0; left: clamp(18px, 3.5vw, 30px); width: 48px; height: 3px;
    background: linear-gradient(90deg, var(--brass-bright), var(--brass));
    border-radius: 0 0 4px 4px;
  }

  label.field-label {
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: .7rem;
    letter-spacing: .1em; color: var(--text-dim-color); text-transform: uppercase;
    margin: 16px 0 6px; font-weight: 600;
  }
  label.field-label:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%; padding: 12px 14px; background: var(--input-bg);
    border: 1px solid var(--hairline); border-radius: var(--radius); color: var(--text);
    font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; line-height: 1.5;
    transition: var(--transition);
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--text-placeholder); }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--brass); background: var(--input-focus-bg); box-shadow: 0 0 14px var(--brass-glow);
  }
  textarea { resize: vertical; min-height: 110px; }

  .text-stats {
    display: flex; gap: 12px; font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; color: var(--text-dim-color); margin-top: 6px;
  }

  .file-dropzone {
    position: relative; border: 1px dashed var(--hairline); border-radius: var(--radius);
    padding: 12px 16px; background: var(--input-bg); display: flex; align-items: center;
    justify-content: space-between; cursor: pointer; transition: var(--transition); min-height: 50px;
  }
  .file-dropzone:hover, .file-dropzone.dragover { border-color: var(--brass); background: var(--brass-glow); }
  .file-dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 1;
  }
  .file-info { display: flex; align-items: center; gap: 10px; color: var(--text-dim-color); font-size: .85rem; width: 100%; overflow: hidden; }
  .file-info i { color: var(--brass); font-size: 1rem; flex-shrink: 0; }
  .file-name { font-family: 'IBM Plex Mono', monospace; font-size: .78rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  .btn-remove-file {
    background: none; border: none; color: var(--danger); font-size: 1rem; cursor: pointer;
    padding: 4px 8px; border-radius: var(--radius-sm); display: none; z-index: 2; transition: var(--transition);
  }
  .btn-remove-file:hover { background: var(--danger-bg); }

  #btnSalvar {
    width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: var(--radius);
    background: linear-gradient(135deg, #d4af37, #b8942d); color: #050807;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .95rem;
    letter-spacing: .03em; cursor: pointer; transition: var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 16px var(--brass-glow); min-height: 48px;
  }
  #btnSalvar:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35); }
  #btnSalvar:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .hint { font-size: .8rem; color: var(--danger); margin-top: 10px; min-height: 1.2em; font-family: 'IBM Plex Mono', monospace; word-break: break-word; }

  /* BARRA DE CONTROLE DO COFRE */
  .vault-controls { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .search-box { flex: 1; position: relative; min-width: 240px; }
  .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim-color); font-size: .9rem; }
  .search-box input { padding-left: 40px; height: 44px; }

  .backup-actions { display: flex; gap: 8px; }
  .btn-backup {
    background: var(--input-bg); border: 1px solid var(--hairline); color: var(--text-dim-color);
    padding: 0 14px; border-radius: var(--radius); cursor: pointer; font-size: .82rem;
    display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace;
    transition: var(--transition); height: 44px;
  }
  .btn-backup:hover { border-color: var(--brass); color: var(--brass); background: var(--input-focus-bg); }

  /* CARDS REVISADOS E CORRIGIDOS */
  #listaPrompts { 
    display: grid; 
    grid-template-columns: var(--card-grid-cols); 
    gap: clamp(16px, 2vw, 22px); 
    align-items: stretch;
  }

  .state-msg {
    grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-dim-color);
    border: 1px dashed var(--hairline); border-radius: var(--radius-lg); background: var(--panel);
  }
  .state-msg i { font-size: 2rem; color: var(--brass-dim); display: block; margin-bottom: 12px; }

  .prompt-card {
    background: var(--panel-card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--hairline); border-radius: var(--radius-lg);
    padding: clamp(16px, 2.5vw, 20px); box-shadow: var(--shadow-card);
    transition: var(--transition); display: flex; flex-direction: column; height: 100%;
  }
  .prompt-card:hover { border-color: var(--hairline-hover); transform: translateY(-2px); box-shadow: var(--shadow-main); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  
  .ledger-no {
    background: var(--input-bg); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 2px 7px; font-family: 'IBM Plex Mono', monospace; font-size: .68rem;
    color: var(--brass); font-weight: 600; flex-shrink: 0;
  }
  
  .card-title {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(1.05rem, 1.5vw, 1.2rem);
    margin: 0; line-height: 1.3; color: var(--text); word-break: break-word; flex: 1;
  }

  .tag-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .tag-pill {
    background: var(--teal-bg); color: var(--teal); border: 1px solid rgba(77, 182, 172, 0.22);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; padding: 2px 7px; border-radius: 10px;
  }

  /* ROLAGEM INTERNA EM PROMPTS LONGOS */
  .card-body {
    font-size: .88rem; line-height: 1.55; color: var(--text); margin: 0 0 14px;
    white-space: pre-wrap; word-break: break-word; background: var(--code-bg);
    padding: 12px 14px; border-radius: var(--radius); border-left: 3px solid var(--brass);
    flex: 1; max-height: 220px; overflow-y: auto;
  }
  .card-body::-webkit-scrollbar { width: 4px; }
  .card-body::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 4px; }

  .media-wrapper { margin-bottom: 14px; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--hairline); background: #000; }
  .media-preview { width: 100%; max-height: 260px; object-fit: contain; display: block; }

  /* BOTOES DE ACAO SEMPRE ALINHADOS NO RODAPE */
  .card-actions { 
    display: flex; gap: 6px; border-top: 1px solid var(--hairline); 
    padding-top: 12px; margin-top: auto; flex-wrap: nowrap;
  }
  .card-actions button {
    border: none; border-radius: var(--radius-sm); padding: 8px 10px; font-size: .8rem;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px; transition: var(--transition);
    height: 38px; flex: 1; min-width: 0;
  }
  
  .btn-copy { background: var(--teal-bg); color: var(--teal); border: 1px solid rgba(77, 182, 172, 0.28) !important; }
  .btn-copy:hover { background: rgba(77, 182, 172, 0.22); }
  
  .btn-edit { background: var(--input-bg); color: var(--text); border: 1px solid var(--hairline) !important; }
  .btn-edit:hover { border-color: var(--brass) !important; color: var(--brass); }

  .btn-delete { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(229, 115, 115, 0.28) !important; flex: 0 0 38px !important; }
  .btn-delete:hover { background: rgba(229, 115, 115, 0.22); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 2000; display: flex; align-items: center; justify-content: center;
    padding: 16px; opacity: 0; pointer-events: none; transition: var(--transition);
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: var(--radius-lg); width: min(100%, 600px); max-height: 90vh;
    overflow-y: auto; padding: clamp(18px, 3.5vw, 28px); box-shadow: var(--shadow-main);
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; border-bottom: 1px solid var(--hairline); padding-bottom: 10px;
  }
  .modal-header h2 { font-family: 'Fraunces', serif; margin: 0; font-size: 1.25rem; color: var(--brass); }
  .btn-close-modal { background: none; border: none; color: var(--text-dim-color); font-size: 1.1rem; cursor: pointer; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--brass); color: var(--text); padding: 10px 20px; border-radius: 30px;
    font-size: .85rem; box-shadow: var(--shadow-main); opacity: 0; pointer-events: none;
    transition: var(--transition); z-index: 3000; display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 640px) {
    .header-controls { gap: 4px; }
    .mode-badge, .entry-badge { padding: 3px 7px; font-size: 0.65rem; }
    .vault-controls { flex-direction: column; }
    .backup-actions { width: 100%; }
    .btn-backup { flex: 1; justify-content: center; }
  }

  @media (min-width: 641px) {
    :root { --card-grid-cols: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dial" aria-hidden="true"></div>
    <div class="wordmark">Prompt<span>Vault</span></div>
  </div>
  
  <div class="header-controls">
    <button type="button" class="theme-toggle-btn" id="themeToggle" title="Alternar Tema" aria-label="Alternar Tema">
      <i class="fa-solid fa-moon"></i>
    </button>
    <div class="mode-badge cloud" id="storageModeBadge">Conectando...</div>
    <div class="entry-badge" id="entryCount">000 Entradas</div>
  </div>
</header>

<main class="main-wrapper">

  <div class="eyebrow-container">
    <p class="eyebrow">Nova Entrada</p>
  </div>

  <form class="form-container" id="vaultForm" autocomplete="off">
    <label class="field-label" for="titulo">Título do Prompt</label>
    <input type="text" id="titulo" placeholder="Ex.: Iluminação Cinematográfica para Midjourney" required>

    <label class="field-label" for="tags">Tags / Categorias (Separadas por vírgula)</label>
    <input type="text" id="tags" placeholder="Ex.: midjourney, imagem, iluminação, cinema">

    <label class="field-label" for="conteudo">Prompt Completo</label>
    <textarea id="conteudo" placeholder="Cole as instruções detalhadas do seu prompt aqui..." rows="4" required></textarea>
    <div class="text-stats">
      <span id="charCount">0 caracteres</span> &bull;
      <span id="wordCount">0 palavras</span>
    </div>

    <label class="field-label">Anexo de Referência (Imagem ou Vídeo — Máx 10 MB)</label>
    <div class="file-dropzone" id="dropzone">
      <div class="file-info">
        <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
        <span id="fileNameDisplay">Clique ou arraste um arquivo de mídia</span>
      </div>
      <button type="button" class="btn-remove-file" id="btnRemoveFile" title="Remover arquivo">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <input type="file" id="mediaInput" accept="image/*,video/*">
    </div>

    <button type="submit" id="btnSalvar">
      <i class="fa-solid fa-lock" aria-hidden="true"></i> Selar Entrada no Cofre
    </button>
    <div class="hint" id="hint" role="alert"></div>
  </form>

  <div class="eyebrow-container">
    <p class="eyebrow">Cofre de Prompts</p>
  </div>

  <div class="vault-controls">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar por título, conteúdo ou tags...">
    </div>
    <div class="backup-actions">
      <button type="button" class="btn-backup" id="btnExport" title="Exportar Backup JSON">
        <i class="fa-solid fa-download"></i> Exportar
      </button>
      <button type="button" class="btn-backup" id="btnImport" title="Importar Backup JSON">
        <i class="fa-solid fa-upload"></i> Importar
      </button>
      <input type="file" id="importInput" accept=".json" style="display: none;">
    </div>
  </div>

  <div id="listaPrompts">
    <div class="state-msg"><i class="fa-solid fa-circle-notch fa-spin"></i>Acessando o cofre…</div>
  </div>

</main>

<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2><i class="fa-solid fa-pen-to-square"></i> Editar Prompt</h2>
      <button type="button" class="btn-close-modal" id="btnCloseModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="editForm">
      <input type="hidden" id="editDocId">
      <label class="field-label" for="editTitulo">Título do Prompt</label>
      <input type="text" id="editTitulo" required>

      <label class="field-label" for="editTags">Tags (Separadas por vírgula)</label>
      <input type="text" id="editTags">

      <label class="field-label" for="editConteudo">Prompt Completo</label>
      <textarea id="editConteudo" rows="5" required></textarea>

      <label class="field-label">Substituir / Adicionar Mídia (Opcional)</label>
      <div class="file-dropzone" id="editDropzone">
        <div class="file-info">
          <i class="fa-solid fa-paperclip"></i>
          <span id="editFileNameDisplay">Escolher nova mídia...</span>
        </div>
        <button type="button" class="btn-remove-file" id="btnEditRemoveFile"><i class="fa-solid fa-xmark"></i></button>
        <input type="file" id="editMediaInput" accept="image/*,video/*">
      </div>

      <button type="submit" id="btnSalvarEdicao" style="margin-top:20px;" class="btn-backup">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Alterações
      </button>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-check" aria-hidden="true"></i>
  <span id="toastMsg"></span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { 
    getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { 
    getStorage, ref, uploadBytes, getDownloadURL, deleteObject 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDNKgpaOCQ00RVxELsjAh3zoQZr3_PCis4",
    authDomain: "cofre-de-prompts.firebaseapp.com",
    projectId: "cofre-de-prompts",
    storageBucket: "cofre-de-prompts.firebasestorage.app",
    messagingSenderId: "503764090683",
    appId: "1:503764090683:web:f9f9c7600a4846e030c11e"
  };

  const vaultForm        = document.getElementById('vaultForm');
  const tituloEl         = document.getElementById('titulo');
  const tagsEl           = document.getElementById('tags');
  const conteudoEl       = document.getElementById('conteudo');
  const btnSalvar        = document.getElementById('btnSalvar');
  const listaPrompts     = document.getElementById('listaPrompts');
  const hint             = document.getElementById('hint');
  const entryCount       = document.getElementById('entryCount');
  const mediaInput       = document.getElementById('mediaInput');
  const dropzone         = document.getElementById('dropzone');
  const fileNameDisplay  = document.getElementById('fileNameDisplay');
  const btnRemoveFile    = document.getElementById('btnRemoveFile');
  const searchInput      = document.getElementById('searchInput');
  const toast            = document.getElementById('toast');
  const toastMsg         = document.getElementById('toastMsg');
  const themeToggleBtn   = document.getElementById('themeToggle');
  const themeIcon        = themeToggleBtn.querySelector('i');
  const storageModeBadge = document.getElementById('storageModeBadge');
  const htmlEl           = document.documentElement;

  const charCount        = document.getElementById('charCount');
  const wordCount        = document.getElementById('wordCount');

  const editModal        = document.getElementById('editModal');
  const btnCloseModal    = document.getElementById('btnCloseModal');
  const editForm         = document.getElementById('editForm');
  const editDocId        = document.getElementById('editDocId');
  const editTitulo       = document.getElementById('editTitulo');
  const editTags         = document.getElementById('editTags');
  const editConteudo     = document.getElementById('editConteudo');
  const editMediaInput   = document.getElementById('editMediaInput');
  const editFileNameDisplay = document.getElementById('editFileNameDisplay');

  const btnExport        = document.getElementById('btnExport');
  const btnImport        = document.getElementById('btnImport');
  const importInput      = document.getElementById('importInput');

  let db = null;
  let storage = null;
  let auth = null;
  let isFirebaseAvailable = false;
  let entriesCache = [];
  const LOCAL_STORAGE_KEY = 'promptvault_entries_db';

  function applyTheme(theme) {
    htmlEl.setAttribute('data-theme', theme);
    localStorage.setItem('promptvault_theme', theme);
    themeIcon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }

  const savedTheme = localStorage.getItem('promptvault_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

  themeToggleBtn.addEventListener('click', () => {
    const currentTheme = htmlEl.getAttribute('data-theme');
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

  conteudoEl.addEventListener('input', () => {
    const txt = conteudoEl.value;
    charCount.textContent = `${txt.length} caracteres`;
    const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
    wordCount.textContent = `${words} palavras`;
  });

  function escapeHtml(str){
    if (typeof str !== 'string') return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escapeAttr(str){
    if (typeof str !== 'string') return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'&#10;');
  }

  function showToast(msg, iconClass = 'fa-check'){
    toastMsg.textContent = msg;
    toast.querySelector('i').className = 'fa-solid ' + iconClass;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function resetFileInput(){
    mediaInput.value = '';
    fileNameDisplay.textContent = 'Clique ou arraste um arquivo de mídia';
    fileNameDisplay.classList.remove('file-name');
    btnRemoveFile.style.display = 'none';
  }

  ['dragenter', 'dragover'].forEach(e => dropzone.addEventListener(e, (evt) => {
    evt.preventDefault(); evt.stopPropagation(); dropzone.classList.add('dragover');
  }));

  ['dragleave', 'drop'].forEach(e => dropzone.addEventListener(e, (evt) => {
    evt.preventDefault(); evt.stopPropagation(); dropzone.classList.remove('dragover');
  }));

  mediaInput.addEventListener('change', () => {
    const file = mediaInput.files[0];
    if (file) {
      if (file.size > 10 * 1024 * 1024) {
        hint.textContent = 'O arquivo selecionado excede o limite máximo de 10 MB.';
        resetFileInput();
        return;
      }
      hint.textContent = '';
      fileNameDisplay.textContent = file.name;
      fileNameDisplay.classList.add('file-name');
      btnRemoveFile.style.display = 'block';
    } else {
      resetFileInput();
    }
  });

  btnRemoveFile.addEventListener('click', (e) => {
    e.preventDefault(); e.stopPropagation(); resetFileInput();
  });

  function getLocalEntries() {
    try {
      return JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveLocalEntries(list) {
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));
    entriesCache = list;
    aplicarFiltroEExibir();
  }

  function setModeUI(isCloud) {
    if (isCloud) {
      storageModeBadge.textContent = 'Nuvem';
      storageModeBadge.className = 'mode-badge cloud';
    } else {
      storageModeBadge.textContent = 'Modo Local';
      storageModeBadge.className = 'mode-badge local';
    }
  }

  vaultForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hint.textContent = '';

    const titulo   = tituloEl.value.trim();
    const conteudo = conteudoEl.value.trim();
    const tags     = tagsEl.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);

    if (!titulo || !conteudo){
      hint.textContent = 'Preencha o título e o conteúdo antes de selar.';
      return;
    }

    const originalText = btnSalvar.innerHTML;
    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';

    if (isFirebaseAvailable) {
      try {
        let mediaUrl = null;
        let storagePath = null;
        let mediaType = null;

        if (mediaInput.files.length > 0){
          const file = mediaInput.files[0];
          if (file.size > 10 * 1024 * 1024) {
            throw new Error("Tamanho do arquivo excede 10 MB.");
          }
          mediaType = file.type || 'application/octet-stream';
          const ext = file.name.split('.').pop();
          storagePath = `prompts/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
          
          const storageRef = ref(storage, storagePath);
          await uploadBytes(storageRef, file);
          mediaUrl = await getDownloadURL(storageRef);
        }

        await addDoc(collection(db, 'entries'), {
          titulo, conteudo, tags, mediaUrl, storagePath, mediaType, createdAt: new Date().toISOString()
        });

        vaultForm.reset(); resetFileInput();
        charCount.textContent = '0 caracteres'; wordCount.textContent = '0 palavras';
        showToast('Entrada salva na nuvem com sucesso!');
      } catch (err) {
        console.error("Erro ao gravar no Firebase:", err);
        hint.textContent = `Erro no envio: ${err.message || 'Verifique sua conexão.'}`;
        showToast('Erro ao gravar na nuvem.', 'fa-triangle-exclamation');
      }
    } else {
      salvarLocalmente(titulo, conteudo, tags);
    }

    btnSalvar.disabled = false;
    btnSalvar.innerHTML = originalText;
  });

  function salvarLocalmente(titulo, conteudo, tags = []) {
    const list = getLocalEntries();
    const file = mediaInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        list.unshift({
          id: 'local_' + Date.now(),
          titulo, conteudo, tags,
          mediaUrl: evt.target.result,
          mediaType: file.type,
          createdAt: new Date().toISOString()
        });
        saveLocalEntries(list);
        vaultForm.reset(); resetFileInput();
        charCount.textContent = '0 caracteres'; wordCount.textContent = '0 palavras';
        showToast('Entrada selada localmente!');
      };
      reader.readAsDataURL(file);
    } else {
      list.unshift({
        id: 'local_' + Date.now(),
        titulo, conteudo, tags, mediaUrl: null, mediaType: null,
        createdAt: new Date().toISOString()
      });
      saveLocalEntries(list);
      vaultForm.reset(); resetFileInput();
      charCount.textContent = '0 caracteres'; wordCount.textContent = '0 palavras';
      showToast('Entrada selada localmente!');
    }
  }

  function abrirModalEdicao(id) {
    const item = entriesCache.find(e => e.id === id);
    if (!item) return;

    editDocId.value = item.id;
    editTitulo.value = item.titulo || '';
    editTags.value = (item.tags || []).join(', ');
    editConteudo.value = item.conteudo || '';
    editMediaInput.value = '';
    editFileNameDisplay.textContent = item.mediaUrl ? 'Alterar mídia anexada...' : 'Escolher mídia...';
    
    editModal.classList.add('active');
  }

  btnCloseModal.addEventListener('click', () => editModal.classList.remove('active'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') editModal.classList.remove('active');
  });

  editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = editDocId.value;
    const item = entriesCache.find(e => e.id === id);
    if (!item) return;

    const novoTitulo = editTitulo.value.trim();
    const novoConteudo = editConteudo.value.trim();
    const novasTags = editTags.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);

    if (isFirebaseAvailable && !id.startsWith('local_')) {
      try {
        let mediaUrl = item.mediaUrl || null;
        let storagePath = item.storagePath || null;
        let mediaType = item.mediaType || null;

        if (editMediaInput.files.length > 0) {
          const file = editMediaInput.files[0];
          mediaType = file.type || 'application/octet-stream';
          const ext = file.name.split('.').pop();
          storagePath = `prompts/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
          
          if (item.storagePath) {
            await deleteObject(ref(storage, item.storagePath)).catch(() => {});
          }

          const storageRef = ref(storage, storagePath);
          await uploadBytes(storageRef, file);
          mediaUrl = await getDownloadURL(storageRef);
        }

        await updateDoc(doc(db, 'entries', id), {
          titulo: novoTitulo, conteudo: novoConteudo, tags: novasTags, mediaUrl, storagePath, mediaType
        });

        showToast('Prompt atualizado com sucesso!');
        editModal.classList.remove('active');
      } catch (err) {
        showToast('Erro ao atualizar no Firebase', 'fa-triangle-exclamation');
      }
    } else {
      const list = getLocalEntries();
      const idx = list.findIndex(e => e.id === id);
      if (idx !== -1) {
        list[idx].titulo = novoTitulo;
        list[idx].conteudo = novoConteudo;
        list[idx].tags = novasTags;

        if (editMediaInput.files.length > 0) {
          const file = editMediaInput.files[0];
          const reader = new FileReader();
          reader.onload = function(evt) {
            list[idx].mediaUrl = evt.target.result;
            list[idx].mediaType = file.type;
            saveLocalEntries(list);
            showToast('Prompt local atualizado!');
            editModal.classList.remove('active');
          };
          reader.readAsDataURL(file);
          return;
        }

        saveLocalEntries(list);
        showToast('Prompt local atualizado!');
        editModal.classList.remove('active');
      }
    }
  });

  listaPrompts.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const docId = btn.dataset.id;
    if (!docId) return;

    if (btn.classList.contains('btn-edit')) {
      abrirModalEdicao(docId);
    } else if (btn.classList.contains('btn-delete')){
      if (!confirm('Tem certeza de que deseja remover esta entrada?')) return;
      
      if (isFirebaseAvailable && !docId.startsWith('local_')) {
        const itemToDelete = entriesCache.find(i => i.id === docId);
        try {
          if (itemToDelete && itemToDelete.storagePath) {
            await deleteObject(ref(storage, itemToDelete.storagePath)).catch(() => {});
          }
          await deleteDoc(doc(db, 'entries', docId));
          showToast('Entrada removida da nuvem.', 'fa-trash-can');
        } catch (err) {
          console.error("Erro ao excluir do Firebase:", err);
          showToast('Erro ao remover da nuvem.', 'fa-triangle-exclamation');
        }
      } else {
        const list = getLocalEntries().filter(i => i.id !== docId);
        saveLocalEntries(list);
        showToast('Entrada removida do armazenamento local.', 'fa-trash-can');
      }
    } else if (btn.classList.contains('btn-copy')){
      const texto = btn.dataset.texto || '';
      try {
        await navigator.clipboard.writeText(texto);
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
        showToast('Prompt copiado com sucesso.');
        setTimeout(() => btn.innerHTML = originalContent, 1600);
      } catch (err) {
        showToast('Erro ao copiar.', 'fa-triangle-exclamation');
      }
    }
  });

  btnExport.addEventListener('click', () => {
    if (entriesCache.length === 0) {
      showToast('Nenhuma entrada para exportar.', 'fa-triangle-exclamation');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entriesCache, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `promptvault_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    showToast('Backup exportado com sucesso!');
  });

  btnImport.addEventListener('click', () => importInput.click());

  importInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async (evt) => {
      try {
        const importedData = JSON.parse(evt.target.result);
        if (!Array.isArray(importedData)) throw new Error('Formato inválido');

        if (confirm(`Deseja importar ${importedData.length} entrada(s)?`)) {
          const list = getLocalEntries();
          importedData.forEach(item => {
            if (!item.id) item.id = 'imported_' + Date.now() + Math.random().toString(36).substring(2, 5);
            list.unshift(item);
          });
          saveLocalEntries(list);
          showToast('Backup importado no armazenamento local!');
        }
      } catch (err) {
        showToast('Arquivo JSON inválido.', 'fa-triangle-exclamation');
      }
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  searchInput.addEventListener('input', () => aplicarFiltroEExibir());

  function aplicarFiltroEExibir() {
    const term = searchInput.value.toLowerCase().trim();
    if (!term) {
      renderizar(entriesCache);
      return;
    }
    const filtered = entriesCache.filter(item => 
      (item.titulo || '').toLowerCase().includes(term) || 
      (item.conteudo || '').toLowerCase().includes(term) ||
      (item.tags || []).some(t => t.toLowerCase().includes(term))
    );
    renderizar(filtered, true);
  }

  function renderizar(entries, isSearching = false){
    entryCount.textContent = `${String(entriesCache.length).padStart(3, '0')} Entradas`;

    if (entries.length === 0){
      listaPrompts.innerHTML = `
        <div class="state-msg">
          <i class="fa-solid ${isSearching ? 'fa-magnifying-glass' : 'fa-vault'}"></i>
          ${isSearching ? 'Nenhum resultado encontrado.' : 'O cofre está vazio.'}
          <div class="sub">${isSearching ? 'Tente buscar por outros termos.' : 'Crie sua primeira entrada no formulário acima.'}</div>
        </div>`;
      return;
    }

    listaPrompts.innerHTML = entries.map((p) => {
      const numero = String(entriesCache.length - entriesCache.findIndex(e => e.id === p.id)).padStart(3, '0');
      let mediaHTML = '';

      if (p.mediaUrl) {
        const isVideo = (p.mediaType || '').startsWith('video/');
        mediaHTML = `
          <div class="media-wrapper">
            ${isVideo 
              ? `<video src="${p.mediaUrl}" class="media-preview" controls preload="metadata"></video>`
              : `<img src="${p.mediaUrl}" class="media-preview" alt="Anexo de ${escapeAttr(p.titulo)}" loading="lazy">`
            }
          </div>`;
      }

      const tagsHTML = (p.tags && p.tags.length > 0)
        ? `<div class="tag-pills">${p.tags.map(t => `<span class="tag-pill">#${escapeHtml(t)}</span>`).join('')}</div>`
        : '';

      return `
        <article class="prompt-card">
          <div class="card-header">
            <h3 class="card-title">${escapeHtml(p.titulo)}</h3>
            <span class="ledger-no">N&deg; ${numero}</span>
          </div>
          ${tagsHTML}
          <div class="card-body">${escapeHtml(p.conteudo)}</div>
          ${mediaHTML}
          <div class="card-actions">
            <button class="btn-copy" data-id="${p.id}" data-texto="${escapeAttr(p.conteudo)}" aria-label="Copiar prompt">
              <i class="fa-solid fa-copy"></i> Copiar
            </button>
            <button class="btn-edit" data-id="${p.id}" aria-label="Editar entrada">
              <i class="fa-solid fa-pen-to-square"></i> Editar
            </button>
            <button class="btn-delete" data-id="${p.id}" aria-label="Excluir entrada">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </article>`;
    }).join('');
  }

  function fallbackToLocalStorage(msg) {
    isFirebaseAvailable = false;
    setModeUI(false);
    if (msg) hint.textContent = msg;
    entriesCache = getLocalEntries();
    aplicarFiltroEExibir();
  }

  function conectarFirestore() {
    const entriesRef = collection(db, 'entries');

    onSnapshot(entriesRef, (snapshot) => {
      isFirebaseAvailable = true;
      setModeUI(true);
      hint.textContent = '';
      
      const docs = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));

      docs.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      entriesCache = docs;
      aplicarFiltroEExibir();
    }, (error) => {
      console.error("Erro no onSnapshot do Firebase:", error);
      if (error.code === 'permission-denied') {
        fallbackToLocalStorage('Permissão negada no Firestore. Ajuste as Regras de Segurança no Console.');
      } else {
        fallbackToLocalStorage(`Firebase indisponível (${error.code || 'Erro de Conexão'}). Alternado para Modo Local.`);
      }
    });
  }

  function iniciarApp() {
    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      storage = getStorage(app);

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          signInAnonymously(auth).then(() => {
            conectarFirestore();
          }).catch((err) => {
            console.warn("Autenticação anônima indisponível, tentando conexão direta:", err);
            conectarFirestore();
          });
        } else {
          conectarFirestore();
        }
      });

    } catch (e) {
      console.error("Erro na inicialização do Firebase:", e);
      fallbackToLocalStorage("Erro na inicialização do Firebase. Usando Modo Local.");
    }
  }

  iniciarApp();
</script>
</body>
</html>
