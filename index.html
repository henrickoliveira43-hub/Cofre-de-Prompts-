<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptVault 🔒</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #10b981;
            --bg-dark: #0f172a;
            --panel: rgba(30, 41, 59, 0.6);
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            padding-top: 80px;
            min-height: 100vh;
        }

        /* --- Header Responsivo --- */
        header {
            position: fixed; top: 0; width: 100%; height: 60px;
            padding: 0 5%; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
            box-sizing: border-box;
        }

        /* --- Layout Fluido --- */
        .main-wrapper { 
            width: 90%; max-width: 700px; margin: 0 auto; padding: 20px 0; 
        }

        .form-container {
            background: var(--panel); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- Inputs e Botões --- */
        input, textarea {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: white; box-sizing: border-box;
        }

        button {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: var(--primary); color: #000; font-weight: 700; cursor: pointer;
        }

        /* --- Cards Responsivos --- */
        .prompt-card {
            background: var(--glass); padding: 20px; border-radius: 16px;
            margin-top: 20px; border: 1px solid rgba(255,255,255,0.05);
        }

        .media-preview { 
            width: 100%; height: auto; border-radius: 12px; margin-top: 15px; display: block;
        }

        /* --- Breakpoints para Celular --- */
        @media (max-width: 480px) {
            header { padding: 0 20px; }
            .main-wrapper { width: 95%; }
            .logo { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> PromptVault</div>
    </header>

    <div class="main-wrapper">
        <div class="form-container">
            <input type="text" id="titulo" placeholder="Título do Prompt">
            <textarea id="conteudo" placeholder="Cole seu prompt aqui..." rows="4"></textarea>
            <input type="file" id="mediaInput" accept="image/*,video/*">
            <button id="btnSalvar">Salvar no Cofre</button>
        </div>

        <div id="listaPrompts"></div>
    </div>

    <script type="module">
        // ... (Seu código JS permanece igual, a responsividade é tratada pelo CSS acima)
        
        // Dica: Adicione este pequeno ajuste no renderizador para garantir que o vídeo não quebre o layout
        /* 
           O estilo CSS .media-preview { width: 100%; height: auto; } 
           já garante que, independentemente da resolução da imagem/vídeo, 
           ele sempre ocupará 100% da largura do card.
        */
    </script>
</body>
</html>
