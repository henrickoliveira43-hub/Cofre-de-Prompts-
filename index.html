<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptVault 🔒</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #10b981; --bg-dark: #0f172a; --panel: rgba(30, 41, 59, 0.6); --text: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); margin: 0; padding-top: 80px; min-height: 100vh; }
        header { position: fixed; top: 0; width: 100%; height: 60px; padding: 0 5%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; z-index: 1000; box-sizing: border-box; }
        .main-wrapper { width: 90%; max-width: 600px; margin: 0 auto; padding: 20px 0; }
        .form-container { background: var(--panel); padding: 25px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; box-sizing: border-box; }
        button { cursor: pointer; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        #btnSalvar { background: var(--primary); color: #000; width: 100%; padding: 12px; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-copy { background: #3b82f6; color: white; margin-right: 5px; }
        .prompt-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .media-preview { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> PromptVault</div>
    </header>

    <div class="main-wrapper">
        <div class="form-container">
            <input type="text" id="titulo" placeholder="Título do Prompt">
            <textarea id="conteudo" placeholder="Cole seu prompt aqui..." rows="3"></textarea>
            <input type="file" id="mediaInput" accept="image/*,video/*">
            <button id="btnSalvar">Salvar no Cofre</button>
        </div>
        <div id="listaPrompts"></div>
    </div>

    <script>
        const btnSalvar = document.getElementById('btnSalvar');
        const listaPrompts = document.getElementById('listaPrompts');

        document.addEventListener('DOMContentLoaded', renderizar);

        btnSalvar.addEventListener('click', async () => {
            const titulo = document.getElementById('titulo').value;
            const conteudo = document.getElementById('conteudo').value;
            const fileInput = document.getElementById('mediaInput');

            if (!titulo || !conteudo) return alert("Preencha título e conteúdo!");

            let mediaData = null;
            if (fileInput.files.length > 0) {
                mediaData = await converterParaBase64(fileInput.files[0]);
            }

            const novoPrompt = { id: Date.now(), titulo, conteudo, mediaData, tipo: fileInput.files[0]?.type };
            const prompts = JSON.parse(localStorage.getItem('prompts') || '[]');
            prompts.unshift(novoPrompt);
            localStorage.setItem('prompts', JSON.stringify(prompts));
            
            renderizar();
            document.getElementById('titulo').value = '';
            document.getElementById('conteudo').value = '';
            fileInput.value = '';
        });

        // Delegação de eventos para excluir e copiar
        listaPrompts.addEventListener('click', (e) => {
            const id = parseInt(e.target.dataset.id);
            if (e.target.classList.contains('btn-delete')) {
                remover(id);
            } else if (e.target.classList.contains('btn-copy')) {
                const texto = e.target.dataset.texto;
                navigator.clipboard.writeText(texto);
                alert("Prompt copiado!");
            }
        });

        function converterParaBase64(file) {
            return new Promise(res => {
                const reader = new FileReader();
                reader.onload = e => res(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function remover(id) {
            let prompts = JSON.parse(localStorage.getItem('prompts') || '[]');
            prompts = prompts.filter(p => p.id !== id);
            localStorage.setItem('prompts', JSON.stringify(prompts));
            renderizar();
        }

        function renderizar() {
            const prompts = JSON.parse(localStorage.getItem('prompts') || '[]');
            listaPrompts.innerHTML = prompts.map(p => `
                <div class="prompt-card">
                    <h3>${p.titulo}</h3>
                    <p>${p.conteudo}</p>
                    ${p.mediaData ? (p.tipo.includes('video') ? `<video src="${p.mediaData}" class="media-preview" controls></video>` : `<img src="${p.mediaData}" class="media-preview">`) : ''}
                    <button class="btn-copy" data-texto="${p.conteudo.replace(/"/g, '&quot;')}">Copiar</button>
                    <button class="btn-delete" data-id="${p.id}">Excluir</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
