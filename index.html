<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptVault 🔒</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
            --panel-bg: rgba(30, 41, 59, 0.45);
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.06);
            --btn-copy: #3b82f6;
            --btn-copy-hover: #2563eb;
            --btn-delete: #ef4444;
            --btn-delete-hover: #dc2626;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .app-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #34d399, #3b82f6, #a855f7);
            background-size: 200% auto;
            animation: shineText 4s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        @keyframes shineText { to { background-position: 200% center; } }

        .app-header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            margin-bottom: 35px;
            animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-group { margin-bottom: 22px; }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #34d399;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        textarea { resize: vertical; height: 140px; line-height: 1.6; }

        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            color: #0f172a;
            border: none;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
            filter: brightness(1.1);
        }

        .search-container { width: 100%; max-width: 800px; margin-bottom: 30px; }
        .search-container input { background-color: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); }
        .search-container input:focus { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }

        .prompt-list { width: 100%; max-width: 800px; display: grid; gap: 25px; grid-template-columns: 1fr; }

        .prompt-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 26px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: cardAppear 0.5s ease-out forwards;
            opacity: 0;
        }

        .prompt-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.8);
        }

        .prompt-title { margin: 0 0 18px 0; font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .prompt-content {
            background-color: rgba(15, 23, 42, 0.8); padding: 18px; border-radius: 10px;
            font-family: 'Fira Code', monospace; font-size: 0.9rem; white-space: pre-wrap;
            margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.04); color: #34d399;
            max-height: 250px; overflow-y: auto;
        }

        .card-actions { display: flex; gap: 12px; }
        .btn-action { border: none; padding: 12px 22px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s ease; display: flex; align-items: center; gap: 8px; color: white; }
        .btn-copy { background-color: var(--btn-copy); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }
        .btn-copy:hover { background-color: var(--btn-copy-hover); transform: translateY(-1px); }
        .btn-delete { background-color: var(--btn-delete); margin-left: auto; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        .btn-delete:hover { background-color: var(--btn-delete-hover); transform: translateY(-1px); }

        #toast {
            visibility: hidden; min-width: 300px; background: linear-gradient(135deg, #10b981, #059669);
            color: #0f172a; font-weight: 700; text-align: center; border-radius: 12px; padding: 18px;
            position: fixed; z-index: 100; bottom: -50px; left: 50%; transform: translateX(-50%);
            font-size: 0.95rem; box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0;
        }
        #toast.show { visibility: visible; bottom: 40px; opacity: 1; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-header">
        <h1><i class="fa-solid fa-shield-halved"></i> PromptVault</h1>
        <p>Seu ecossistema privado e inteligente de prompts na nuvem</p>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="container">
            <div class="form-group">
                <label for="titulo">Título do Prompt</label>
                <input type="text" id="titulo" placeholder="Ex: Engenheiro de Software Sênior Python" required>
            </div>
            <div class="form-group">
                <label for="conteudo">Corpo do Prompt</label>
                <textarea id="conteudo" placeholder="Escreva as diretrizes detalhadas do prompt aqui..." required></textarea>
            </div>
            <button id="btnSalvar" class="btn-primary">
                <i class="fa-solid fa-bookmark"></i> Salvar no Cofre
            </button>
        </div>

        <div class="search-container">
            <input type="text" id="buscaInput" placeholder="🔍 Buscar por título ou palavras-chave...">
        </div>

        <div class="prompt-list" id="listaPrompts">
            <p style="text-align: center; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Conectando ao banco de dados...</p>
        </div>
    </div>

    <div id="toast">Operação realizada!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Sua configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDNKgpaOCQ00RVxELsjAh3zoQZr3_PCis4",
            authDomain: "cofre-de-prompts.firebaseapp.com",
            projectId: "cofre-de-prompts",
            storageBucket: "cofre-de-prompts.firebasestorage.app",
            messagingSenderId: "503764090683",
            appId: "1:503764090683:web:f9f9c7600a4846e030c11e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const p_collection = collection(db, "prompts");

        let todosPrompts = [];

        // Escuta os dados em tempo real (Sem travas de autenticação)
        const q = query(p_collection, orderBy("criadoEm", "desc"));
        onSnapshot(q, (snapshot) => {
            todosPrompts = [];
            snapshot.forEach((docSnapshot) => {
                todosPrompts.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            renderizarCards(todosPrompts);
        }, (error) => {
            console.error("Erro no Firestore:", error);
            alert("Erro ao carregar dados. Verifique as regras do Firestore no Console.");
        });

        function renderizarCards(dados) {
            const lista = document.getElementById('listaPrompts');
            lista.innerHTML = '';

            if(dados.length === 0) {
                lista.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Cofre vazio. Guarde seu primeiro prompt acima!</p>';
                return;
            }

            dados.forEach((prompt, index) => {
                const card = document.createElement('div');
                card.className = 'prompt-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <h3 class="prompt-title"><i class="fa-solid fa-terminal" style="color: var(--accent-color); font-size: 1rem;"></i> ${prompt.titulo}</h3>
                    <div class="prompt-content">${prompt.conteudo}</div>
                    <div class="card-actions">
                        <button class="btn-action btn-copy" data-texto="${btoa(unescape(encodeURIComponent(prompt.conteudo)))}"><i class="fa-regular fa-copy"></i> Copiar Prompt</button>
                        <button class="btn-action btn-delete" data-id="${prompt.id}"><i class="fa-regular fa-trash-can"></i> Excluir</button>
                    </div>
                `;
                lista.appendChild(card);
            });

            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.target.closest('.btn-copy');
                    const textoDecodificado = decodeURIComponent(escape(atob(target.dataset.texto)));
                    copiarPrompt(textoDecodificado);
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.target.closest('.btn-delete');
                    deletarPrompt(target.dataset.id);
                });
            });
        }

        document.getElementById('buscaInput').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase().trim();
            const filtrados = todosPrompts.filter(p => 
                p.titulo.toLowerCase().includes(termo) || 
                p.conteudo.toLowerCase().includes(termo)
            );
            renderizarCards(filtrados);
        });

        async function adicionarPrompt() {
            const tituloInput = document.getElementById('titulo');
            const conteudoInput = document.getElementById('conteudo');
            const btnSalvar = document.getElementById('btnSalvar');

            const titulo = tituloInput.value.trim();
            const conteudo = conteudoInput.value.trim();

            if (titulo === '' || conteudo === '') return alert('Por favor, preencha o título e o corpo do prompt.');

            btnSalvar.disabled = true;
            btnSalvar.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Armazenando...`;

            try {
                await addDoc(p_collection, { titulo, conteudo, criadoEm: Date.now() });
                tituloInput.value = '';
                conteudoInput.value = '';
                mostrarToast("Prompt salvo com sucesso!");
            } catch (error) {
                alert("Erro ao gravar dados no servidor.");
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = `<i class="fa-solid fa-bookmark"></i> Salvar no Cofre`;
            }
        }

        async function deletarPrompt(id) {
            if (confirm('Tem certeza de que deseja excluir permanentemente este prompt?')) {
                try {
                    await deleteDoc(doc(db, "prompts", id));
                    mostrarToast("Prompt removido.");
                } catch (error) {
                    alert("Erro ao remover o documento.");
                }
            }
        }

        function copiarPrompt(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast("Copiado para a área de transferência!");
            }).catch(() => alert("Erro ao acessar área de transferência."));
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById("toast");
            toast.innerText = mensagem;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        document.getElementById('btnSalvar').addEventListener('click', adicionarPrompt);
    </script>
</body>
</html>
