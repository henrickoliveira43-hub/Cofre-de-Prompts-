<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b120f;
    --panel:#121c17;
    --panel-2:#0f1813;
    --hairline:rgba(201,169,97,.16);
    --brass:#c9a961;
    --brass-bright:#e6cb87;
    --brass-dim:#7c6a3f;
    --text:#ece6d6;
    --text-dim:#8d9690;
    --text-placeholder:#6b746e;
    --teal:#4f8574;
    --danger:#a94f42;
    --shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(201,169,97,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    padding-top:76px;
  }
  ::selection{ background:var(--brass); color:#0b120f; }
  :focus-visible{ outline: 2px solid var(--brass-bright); outline-offset: 2px; }

  header{
    position:fixed; top:0; left:0; width:100%; height:76px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 5%;
    background:linear-gradient(180deg, #0e1613, #0b120f 90%);
    border-bottom:1px solid var(--hairline);
    z-index:1000;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .dial{
    width:38px; height:38px; border-radius:50%;
    border:2px solid var(--brass-dim);
    position:relative;
    background:radial-gradient(circle at 35% 30%, #1a2620, #0c130f 70%);
    animation: unlock 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  .dial::before{
    content:''; position:absolute; inset:6px; border-radius:50%;
    border:1px solid var(--brass); opacity:.55;
  }
  .dial::after{
    content:''; position:absolute; top:2px; left:50%;
    width:2px; height:8px; background:var(--brass-bright);
    transform:translateX(-50%);
  }
  @keyframes unlock{ from{ transform:rotate(-140deg); opacity:0;} to{ transform:rotate(0deg); opacity:1;} }
  .wordmark{ font-family:'Fraunces', serif; font-weight:600; font-size:1.15rem; letter-spacing:.04em; }
  .wordmark span{ color:var(--brass); font-style:italic; font-weight:400; }
  .entry-count{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.08em;
    color:var(--text-dim); text-transform:uppercase;
  }

  .main-wrapper{ width:90%; max-width:620px; margin:0 auto; padding:34px 0 80px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:.7rem; letter-spacing:.16em;
    color:var(--brass-dim); text-transform:uppercase; margin:0 0 8px 2px;
  }

  .form-container{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:26px 26px 22px;
    margin-bottom:44px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .form-container::before{
    content:''; position:absolute; top:0; left:22px; width:36px; height:3px;
    background:var(--brass); border-radius:0 0 3px 3px;
  }
  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:.68rem;
    letter-spacing:.12em; color:var(--text-dim); text-transform:uppercase;
    margin:14px 0 6px;
  }
  label.field-label:first-of-type{ margin-top:2px; }
  input[type="text"], textarea{
    width:100%; padding:11px 12px; background:rgba(0,0,0,.28);
    border:1px solid var(--hairline); border-radius:3px; color:var(--text);
    font-family:'Space Grotesk', sans-serif; font-size:.95rem;
    transition:border-color .2s;
  }
  input[type="text"]::placeholder, textarea::placeholder{
    color:var(--text-placeholder);
  }
  input[type="text"]:focus, textarea:focus{ border-color:var(--brass-dim); }
  textarea{ resize:vertical; min-height:70px; }

  .file-row{
    display:flex; align-items:center; gap:10px; margin-top:14px;
    border:1px dashed var(--hairline); border-radius:3px; padding:10px 12px;
  }
  .file-row i{ color:var(--brass-dim); }
  .file-row input[type="file"]{
    flex:1; color:var(--text-dim); font-size:.8rem;
  }
  .file-name{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--brass); }

  #btnSalvar{
    width:100%; margin-top:20px; padding:13px; border:none; border-radius:3px;
    background:linear-gradient(180deg, var(--brass-bright), var(--brass));
    color:#171009; font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:.9rem;
    letter-spacing:.03em; cursor:pointer; transition:transform .15s, box-shadow .15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #btnSalvar:hover{ transform:translateY(-1px); box-shadow:0 8px 20px -8px rgba(201,169,97,.5); }
  #btnSalvar:disabled{ opacity:.55; cursor:progress; transform:none; }

  .hint{
    font-size:.75rem; color:var(--danger); margin-top:10px; min-height:1em;
  }
  .hint.ok{ color:var(--teal); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--panel); border:1px solid var(--hairline); color:var(--text);
    padding:10px 18px; border-radius:4px; font-size:.85rem;
    box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
    z-index:2000; display:flex; align-items:center; gap:8px;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  #listaPrompts{ display:flex; flex-direction:column; gap:18px; }

  .state-msg{
    text-align:center; padding:50px 20px; color:var(--text-dim);
    border:1px dashed var(--hairline); border-radius:4px;
  }
  .state-msg i{ font-size:1.6rem; color:var(--brass-dim); display:block; margin-bottom:10px; }
  .state-msg .sub{ font-size:.78rem; margin-top:6px; }

  .prompt-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:4px;
    padding:20px 20px 18px; position:relative;
    animation: rise .35s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .ledger-no{
    position:absolute; top:0; right:18px; transform:translateY(-50%);
    background:var(--bg); border:1px solid var(--hairline); border-radius:2px;
    padding:2px 8px; font-family:'IBM Plex Mono', monospace; font-size:.68rem;
    letter-spacing:.06em; color:var(--brass);
  }
  .card-title{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.15rem; margin:2px 0 8px;
    padding-right:70px; word-break:break-word;
  }
  .card-body{
    font-size:.92rem; line-height:1.55; color:#d8d2c2; margin:0 0 14px;
    white-space:pre-wrap; word-break:break-word;
  }
  .media-preview{
    width:100%; max-height:280px; object-fit:cover; border-radius:3px; margin-bottom:14px;
    border:1px solid var(--hairline); display:block; background:var(--panel-2);
  }
  .card-actions{ display:flex; gap:8px; }
  .card-actions button{
    border:none; border-radius:3px; padding:8px 13px; font-size:.78rem;
    font-family:'Space Grotesk', sans-serif; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:opacity .15s;
  }
  .card-actions button:hover{ opacity:.85; }
  .btn-copy{ background:rgba(79,133,116,.16); color:var(--teal); border:1px solid rgba(79,133,116,.35) !important; }
  .btn-delete{ background:rgba(169,79,66,.14); color:var(--danger); border:1px solid rgba(169,79,66,.32) !important; }

  @media (prefers-reduced-motion: reduce){
    .dial, .prompt-card, .toast{ animation:none !important; transition:none !important; }
  }

  @media (max-width:480px){
    header{ padding:0 5%; }
    .wordmark{ font-size:1rem; }
    .form-container{ padding:22px 18px 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dial" aria-hidden="true"></div>
    <div class="wordmark">Prompt<span>Vault</span></div>
  </div>
  <div class="entry-count" id="entryCount">— entradas seladas</div>
</header>

<div class="main-wrapper">

  <p class="eyebrow">Nova entrada</p>
  <form class="form-container" id="vaultForm" autocomplete="off">
    <label class="field-label" for="titulo">Título</label>
    <input type="text" id="titulo" placeholder="Ex.: Prompt para thumbnail cinematográfica" required>

    <label class="field-label" for="conteudo">Conteúdo</label>
    <textarea id="conteudo" placeholder="Cole o prompt aqui..." rows="3" required></textarea>

    <label class="field-label" for="mediaInput">Anexo (imagem ou vídeo)</label>
    <div class="file-row">
      <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
      <input type="file" id="mediaInput" accept="image/*,video/*">
      <span class="file-name" id="fileName"></span>
    </div>

    <button type="submit" id="btnSalvar"><i class="fa-solid fa-lock" aria-hidden="true"></i> Selar no cofre</button>
    <div class="hint" id="hint"></div>
  </form>

  <p class="eyebrow">Cofre</p>
  <div id="listaPrompts">
    <div class="state-msg"><i class="fa-solid fa-vault" aria-hidden="true"></i>Carregando o cofre…</div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"><i class="fa-solid fa-check" aria-hidden="true"></i><span id="toastMsg"></span></div>

<script>
  /* ---------- IndexedDB ---------- */
  const DB_NAME = 'PromptVaultDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'entries';

  let dbPromise = null;
  function getDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onerror = () => reject(new Error('Não foi possível abrir o banco de dados.'));
      req.onsuccess = () => resolve(req.result);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
    });
    return dbPromise;
  }

  async function loadEntries(){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const data = req.result || [];
        data.sort((a, b) => b.id - a.id);
        resolve(data);
      };
      req.onerror = () => reject(req.error);
    });
  }

  async function saveEntry(entry){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(entry);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteEntry(id){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }

  /* ---------- DOM refs ---------- */
  const vaultForm   = document.getElementById('vaultForm');
  const tituloEl    = document.getElementById('titulo');
  const conteudoEl  = document.getElementById('conteudo');
  const btnSalvar   = document.getElementById('btnSalvar');
  const listaPrompts= document.getElementById('listaPrompts');
  const hint        = document.getElementById('hint');
  const entryCount  = document.getElementById('entryCount');
  const mediaInput  = document.getElementById('mediaInput');
  const fileNameEl  = document.getElementById('fileName');
  const toast       = document.getElementById('toast');
  const toastMsg    = document.getElementById('toastMsg');

  /* ---------- Utils ---------- */
  function escapeHtml(str){
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function escapeAttr(str){
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;')
      .replace(/\n/g,'&#10;')
      .replace(/\r/g,'&#13;');
  }

  function showToast(msg, iconClass){
    toastMsg.textContent = msg;
    const icon = toast.querySelector('i');
    icon.className = 'fa-solid ' + (iconClass || 'fa-check');
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function lerArquivo(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
      reader.readAsArrayBuffer(file);
    });
  }

  /* ---------- Eventos ---------- */
  mediaInput.addEventListener('change', () => {
    const file = mediaInput.files[0];
    fileNameEl.textContent = file ? file.name : '';
  });

  vaultForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hint.textContent = '';
    hint.classList.remove('ok');

    const titulo   = tituloEl.value.trim();
    const conteudo = conteudoEl.value.trim();

    if (!titulo || !conteudo){
      hint.textContent = 'Preencha título e conteúdo antes de selar a entrada.';
      return;
    }

    const originalBtnHTML = btnSalvar.innerHTML;
    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Selando…';

    try {
      let mediaBlob = null;
      let mediaType = null;

      if (mediaInput.files.length > 0){
        const file = mediaInput.files[0];
        mediaType = file.type || 'application/octet-stream';
        const buffer = await lerArquivo(file);
        mediaBlob = new Blob([buffer], { type: mediaType });
      }

      const entry = {
        id: Date.now(),
        titulo,
        conteudo,
        mediaBlob,
        mediaType,
        createdAt: new Date().toISOString()
      };

      await saveEntry(entry);

      vaultForm.reset();
      fileNameEl.textContent = '';
      showToast('Entrada selada com sucesso.');

      await carregar();
    } catch (err) {
      console.error(err);
      hint.textContent = 'Erro ao salvar: ' + (err.message || 'Tente novamente.');
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.innerHTML = originalBtnHTML;
    }
  });

  listaPrompts.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = parseInt(btn.dataset.id, 10);
    if (!id) return;

    if (btn.classList.contains('btn-delete')){
      if (!confirm('Excluir esta entrada do cofre? Esta ação não pode ser desfeita.')) return;
      try {
        await deleteEntry(id);
        showToast('Entrada excluída.', 'fa-trash');
        await carregar();
      } catch (err) {
        hint.textContent = 'Erro ao excluir entrada.';
      }
    } else if (btn.classList.contains('btn-copy')){
      const texto = btn.dataset.texto || '';
      try {
        await navigator.clipboard.writeText(texto);
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i> Copiado';
        showToast('Conteúdo copiado para a área de transferência.');
        setTimeout(() => btn.innerHTML = original, 1400);
      } catch (err) {
        showToast('Não foi possível copiar automaticamente.', 'fa-triangle-exclamation');
      }
    }
  });

  /* ---------- Render ---------- */
  let _mediaURLs = [];

  function renderizar(entries){
    entryCount.textContent = String(entries.length).padStart(3,'0') + ' entradas seladas';

    _mediaURLs.forEach(url => URL.revokeObjectURL(url));
    _mediaURLs = [];

    if (entries.length === 0){
      listaPrompts.innerHTML = `
        <div class="state-msg">
          <i class="fa-solid fa-vault" aria-hidden="true"></i>
          O cofre está vazio.
          <div class="sub">Adicione seu primeiro prompt no formulário acima.</div>
        </div>`;
      return;
    }

    listaPrompts.innerHTML = entries.map((p, i) => {
      const numero = String(i + 1).padStart(3,'0');
      let media = '';

      if (p.mediaBlob) {
        const url = URL.createObjectURL(p.mediaBlob);
        _mediaURLs.push(url);
        const isVideo = (p.mediaType || '').startsWith('video/');
        if (isVideo) {
          media = '<video src="' + url + '" class="media-preview" controls preload="metadata" aria-label="Vídeo anexado à entrada ' + escapeAttr(p.titulo) + '"></video>';
        } else {
          media = '<img src="' + url + '" class="media-preview" alt="Anexo de ' + escapeAttr(p.titulo) + '" loading="lazy">';
        }
      }

      return `
        <article class="prompt-card">
          <span class="ledger-no">N&deg; ${numero}</span>
          <h3 class="card-title">${escapeHtml(p.titulo)}</h3>
          <p class="card-body">${escapeHtml(p.conteudo)}</p>
          ${media}
          <div class="card-actions">
            <button class="btn-copy" data-id="${p.id}" data-texto="${escapeAttr(p.conteudo)}" aria-label="Copiar conteúdo da entrada ${escapeAttr(p.titulo)}">
              <i class="fa-solid fa-copy" aria-hidden="true"></i>Copiar
            </button>
            <button class="btn-delete" data-id="${p.id}" aria-label="Excluir entrada ${escapeAttr(p.titulo)}">
              <i class="fa-solid fa-trash" aria-hidden="true"></i>Excluir
            </button>
          </div>
        </article>`;
    }).join('');
  }

  async function carregar(){
    try {
      const entries = await loadEntries();
      renderizar(entries);
    } catch (err) {
      console.error(err);
      listaPrompts.innerHTML = `
        <div class="state-msg">
          <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
          Erro ao carregar o cofre.
          <div class="sub">Recarregue a página ou verifique as permissões do navegador.</div>
        </div>`;
    }
  }

  carregar();
</script>
</body>
</html>
