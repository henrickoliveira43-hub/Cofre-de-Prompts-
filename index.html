<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault — Cofre Pessoal de Prompts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #080d0b;
    --panel: #111a15;
    --panel-sub: #0a110e;
    --hairline: rgba(201,169,97,.18);
    --hairline-hover: rgba(201,169,97,.4);
    --brass: #c9a961;
    --brass-bright: #ebd193;
    --brass-dim: #7c6a3f;
    --text: #eee9dc;
    --text-dim: #929b95;
    --text-placeholder: #5c6560;
    --teal: #519881;
    --teal-bg: rgba(81,152,129,.12);
    --danger: #c2594a;
    --danger-bg: rgba(194,89,74,.12);
    --shadow-main: 0 24px 48px -12px rgba(0,0,0,.75);
    --shadow-card: 0 12px 28px -8px rgba(0,0,0,.45);
    --radius: 6px;
    --transition: all .2s cubic-bezier(.16, 1, .3, 1);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1400px 600px at 50% -10%, rgba(201,169,97,.08), transparent 70%),
      radial-gradient(800px 400px at 10% 90%, rgba(81,152,129,.04), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    padding-top: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  ::selection{ background: var(--brass); color: #080d0b; }
  :focus-visible{ outline: 2px solid var(--brass-bright); outline-offset: 3px; }

  /* ---------- Header ---------- */
  header{
    position: fixed; top: 0; left: 0; width: 100%; height: 80px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6%;
    background: rgba(8, 13, 11, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline);
    z-index: 1000;
  }
  .brand{ display: flex; align-items: center; gap: 14px; }
  .dial{
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--brass-dim);
    position: relative;
    background: radial-gradient(circle at 35% 30%, #1c2b24, #080d0b 75%);
    box-shadow: inset 0 0 8px rgba(0,0,0,.8);
    animation: unlock 1.2s cubic-bezier(.16, 1, .3, 1) both;
  }
  .dial::before{
    content: ''; position: absolute; inset: 5px; border-radius: 50%;
    border: 1px dashed var(--brass); opacity: .6;
  }
  .dial::after{
    content: ''; position: absolute; top: 3px; left: 50%;
    width: 2px; height: 8px; background: var(--brass-bright);
    transform: translateX(-50%); border-radius: 1px;
    box-shadow: 0 0 6px var(--brass-bright);
  }
  @keyframes unlock{ from{ transform: rotate(-180deg) scale(.9); opacity: 0; } to{ transform: rotate(0deg) scale(1); opacity: 1; } }

  .wordmark{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; letter-spacing: .03em; }
  .wordmark span{ color: var(--brass); font-style: italic; font-weight: 400; }
  
  .entry-badge{
    font-family: 'IBM Plex Mono', monospace; font-size: .75rem; letter-spacing: .08em;
    color: var(--brass); background: rgba(201,169,97,.08);
    border: 1px solid var(--hairline); padding: 6px 12px; border-radius: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .entry-badge::before{
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--brass-bright);
    box-shadow: 0 0 8px var(--brass-bright);
  }

  /* ---------- Layout Principal ---------- */
  .main-wrapper{
    width: 90%; max-width: 720px; margin: 0 auto; padding: 40px 0 100px;
  }

  .eyebrow-container{
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace; font-size: .72rem; letter-spacing: .16em;
    color: var(--brass-dim); text-transform: uppercase; margin: 0;
  }

  /* ---------- Formulário ---------- */
  .form-container{
    background: linear-gradient(180deg, var(--panel), var(--panel-sub));
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 50px;
    box-shadow: var(--shadow-main);
    position: relative;
    transition: var(--transition);
  }
  .form-container:focus-within{ border-color: var(--brass-dim); }
  .form-container::before{
    content: ''; position: absolute; top: 0; left: 24px; width: 42px; height: 3px;
    background: var(--brass); border-radius: 0 0 3px 3px; box-shadow: 0 2px 8px rgba(201,169,97,.4);
  }

  label.field-label{
    display: block; font-family: 'IBM Plex Mono', monospace; font-size: .7rem;
    letter-spacing: .12em; color: var(--text-dim); text-transform: uppercase;
    margin: 18px 0 8px;
  }
  label.field-label:first-of-type{ margin-top: 0; }

  input[type="text"], textarea{
    width: 100%; padding: 12px 14px; background: rgba(0,0,0,.35);
    border: 1px solid var(--hairline); border-radius: var(--radius); color: var(--text);
    font-family: 'Space Grotesk', sans-serif; font-size: .95rem; line-height: 1.5;
    transition: var(--transition);
  }
  input[type="text"]::placeholder, textarea::placeholder{ color: var(--text-placeholder); }
  input[type="text"]:focus, textarea:focus{
    border-color: var(--brass); background: rgba(0,0,0,.5);
  }
  textarea{ resize: vertical; min-height: 90px; }

  /* Input de Arquivo customizado */
  .file-dropzone{
    position: relative;
    border: 1px dashed var(--hairline); border-radius: var(--radius);
    padding: 14px 16px; background: rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: var(--transition);
  }
  .file-dropzone:hover{ border-color: var(--brass-dim); background: rgba(201,169,97,.03); }
  .file-dropzone input[type="file"]{
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
  }
  .file-info{ display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: .85rem; }
  .file-info i{ color: var(--brass); font-size: 1rem; }
  .file-name{ font-family: 'IBM Plex Mono', monospace; font-size: .78rem; color: var(--brass-bright); word-break: break-all; }
  .btn-remove-file{
    background: none; border: none; color: var(--danger); font-size: .85rem;
    cursor: pointer; padding: 4px 8px; border-radius: 3px; display: none;
    z-index: 2; transition: var(--transition);
  }
  .btn-remove-file:hover{ background: var(--danger-bg); }

  #btnSalvar{
    width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: var(--radius);
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: #0b120f; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: .95rem;
    letter-spacing: .03em; cursor: pointer; transition: var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 4px 14px rgba(201,169,97,.2);
  }
  #btnSalvar:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,169,97,.4); }
  #btnSalvar:active{ transform: translateY(0); }
  #btnSalvar:disabled{ opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  .hint{ font-size: .8rem; color: var(--danger); margin-top: 12px; min-height: 1.2em; }

  /* ---------- Controles de Busca e Filtro ---------- */
  .vault-controls{
    display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .search-box{ flex: 1; min-width: 200px; position: relative; }
  .search-box i{ position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: .85rem; }
  .search-box input{ padding-left: 38px; }

  /* ---------- Lista & Cards ---------- */
  #listaPrompts{ display: flex; flex-direction: column; gap: 20px; }

  .state-msg{
    text-align: center; padding: 60px 20px; color: var(--text-dim);
    border: 1px dashed var(--hairline); border-radius: var(--radius); background: rgba(0,0,0,.15);
  }
  .state-msg i{ font-size: 2rem; color: var(--brass-dim); display: block; margin-bottom: 12px; }
  .state-msg .sub{ font-size: .82rem; margin-top: 6px; color: var(--text-placeholder); }

  .prompt-card{
    background: var(--panel); border: 1px solid var(--hairline); border-radius: var(--radius);
    padding: 24px; position: relative; box-shadow: var(--shadow-card);
    transition: var(--transition); animation: rise .4s ease both;
  }
  .prompt-card:hover{ border-color: var(--hairline-hover); transform: translateY(-2px); }
  @keyframes rise{ from{ opacity: 0; transform: translateY(12px); } to{ opacity: 1; transform: translateY(0); } }

  .card-header{
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px;
  }
  .ledger-no{
    background: var(--panel-sub); border: 1px solid var(--hairline); border-radius: 4px;
    padding: 3px 8px; font-family: 'IBM Plex Mono', monospace; font-size: .7rem;
    color: var(--brass); white-space: nowrap;
  }
  .card-title{
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.2rem; margin: 0;
    line-height: 1.35; color: var(--text); word-break: break-word; flex: 1;
  }

  .card-body{
    font-size: .94rem; line-height: 1.6; color: #d1cbc0; margin: 0 0 16px;
    white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,.2);
    padding: 14px; border-radius: 4px; border-left: 2px solid var(--brass-dim);
  }

  .media-wrapper{ margin-bottom: 16px; overflow: hidden; border-radius: 4px; border: 1px solid var(--hairline); background: #000; }
  .media-preview{ width: 100%; max-height: 360px; object-fit: contain; display: block; }

  .card-actions{ display: flex; gap: 10px; border-top: 1px solid rgba(201,169,97,.08); padding-top: 14px; }
  .card-actions button{
    border: none; border-radius: 4px; padding: 8px 14px; font-size: .8rem;
    font-family: 'Space Grotesk', sans-serif; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; gap: 6px; transition: var(--transition);
  }
  .btn-copy{ background: var(--teal-bg); color: var(--teal); border: 1px solid rgba(81,152,129,.3) !important; }
  .btn-copy:hover{ background: rgba(81,152,129,.25); }
  .btn-delete{ background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(194,89,74,.3) !important; margin-left: auto; }
  .btn-delete:hover{ background: rgba(194,89,74,.25); }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--panel); border: 1px solid var(--brass); color: var(--text);
    padding: 12px 22px; border-radius: 30px; font-size: .88rem;
    box-shadow: var(--shadow-main); opacity: 0; pointer-events: none;
    transition: var(--transition); z-index: 2000; display: flex; align-items: center; gap: 10px;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (prefers-reduced-motion: reduce){
    .dial, .prompt-card, .toast{ animation: none !important; transition: none !important; }
  }

  @media (max-width: 600px){
    header{ padding: 0 4%; }
    .main-wrapper{ width: 94%; padding-top: 20px; }
    .form-container{ padding: 20px; }
    .card-actions{ flex-wrap: wrap; }
    .btn-delete{ margin-left: 0; width: 100%; justify-content: center; }
    .btn-copy{ width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dial" aria-hidden="true"></div>
    <div class="wordmark">Prompt<span>Vault</span></div>
  </div>
  <div class="entry-badge" id="entryCount">000 Entradas</div>
</header>

<main class="main-wrapper">

  <div class="eyebrow-container">
    <p class="eyebrow">Nova Entrada</p>
  </div>

  <form class="form-container" id="vaultForm" autocomplete="off">
    <label class="field-label" for="titulo">Título do Prompt</label>
    <input type="text" id="titulo" placeholder="Ex.: Iluminação Cinematográfica para Midjourney" required>

    <label class="field-label" for="conteudo">Prompt Completo</label>
    <textarea id="conteudo" placeholder="Cole as instruções detalhadas do seu prompt aqui..." rows="4" required></textarea>

    <label class="field-label">Anexo de Referência (Imagem ou Vídeo)</label>
    <div class="file-dropzone" id="dropzone">
      <div class="file-info">
        <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
        <span id="fileNameDisplay">Clique ou arraste um arquivo de mídia</span>
      </div>
      <button type="button" class="btn-remove-file" id="btnRemoveFile" title="Remover arquivo">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <input type="file" id="mediaInput" accept="image/*,video/*">
    </div>

    <button type="submit" id="btnSalvar">
      <i class="fa-solid fa-lock" aria-hidden="true"></i> Selar Entrada no Cofre
    </button>
    <div class="hint" id="hint" role="alert"></div>
  </form>

  <div class="eyebrow-container">
    <p class="eyebrow">Cofre de Prompts</p>
  </div>

  <div class="vault-controls">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar por título ou conteúdo...">
    </div>
  </div>

  <div id="listaPrompts">
    <div class="state-msg"><i class="fa-solid fa-circle-notch fa-spin"></i>Acessando o cofre…</div>
  </div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <i class="fa-solid fa-check" aria-hidden="true"></i>
  <span id="toastMsg"></span>
</div>

<script>
  /* ---------- Configuração do IndexedDB (v2 Atualizada) ---------- */
  const DB_NAME = 'PromptVaultDB';
  const DB_VERSION = 2; // Atualizado para suporte a índices
  const STORE_NAME = 'entries';

  let dbPromise = null;

  function getDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      
      req.onerror = () => reject(new Error('Erro ao conectar ao IndexedDB local.'));
      
      req.onsuccess = () => resolve(req.result);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        let store;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        } else {
          store = e.target.transaction.objectStore(STORE_NAME);
        }
        
        // Adicionando índices para buscas eficientes
        if (!store.indexNames.contains('titulo')) {
          store.createIndex('titulo', 'titulo', { unique: false });
        }
        if (!store.indexNames.contains('createdAt')) {
          store.createIndex('createdAt', 'createdAt', { unique: false });
        }
      };
    });
    return dbPromise;
  }

  async function loadEntries(){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => {
        const data = req.result || [];
        data.sort((a, b) => b.id - a.id);
        resolve(data);
      };
      req.onerror = () => reject(req.error);
    });
  }

  async function saveEntry(entry){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put(entry);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }

  async function deleteEntry(id){
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.delete(id);
      req.onsuccess = () => resolve(true);
      req.onerror = () => reject(req.error);
    });
  }

  /* ---------- Elementos DOM ---------- */
  const vaultForm       = document.getElementById('vaultForm');
  const tituloEl        = document.getElementById('titulo');
  const conteudoEl      = document.getElementById('conteudo');
  const btnSalvar       = document.getElementById('btnSalvar');
  const listaPrompts    = document.getElementById('listaPrompts');
  const hint            = document.getElementById('hint');
  const entryCount      = document.getElementById('entryCount');
  const mediaInput      = document.getElementById('mediaInput');
  const fileNameDisplay = document.getElementById('fileNameDisplay');
  const btnRemoveFile   = document.getElementById('btnRemoveFile');
  const searchInput     = document.getElementById('searchInput');
  const toast           = document.getElementById('toast');
  const toastMsg        = document.getElementById('toastMsg');

  let entriesCache = [];

  /* ---------- Métodos Auxiliares ---------- */
  function escapeHtml(str){
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function escapeAttr(str){
    if (typeof str !== 'string') return '';
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;')
      .replace(/\n/g,'&#10;');
  }

  function showToast(msg, iconClass = 'fa-check'){
    toastMsg.textContent = msg;
    const icon = toast.querySelector('i');
    icon.className = 'fa-solid ' + iconClass;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function lerArquivo(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = () => reject(new Error('Erro na leitura do arquivo selecionado.'));
      reader.readAsArrayBuffer(file);
    });
  }

  function resetFileInput(){
    mediaInput.value = '';
    fileNameDisplay.textContent = 'Clique ou arraste um arquivo de mídia';
    fileNameDisplay.classList.remove('file-name');
    btnRemoveFile.style.display = 'none';
  }

  /* ---------- Eventos ---------- */
  mediaInput.addEventListener('change', () => {
    const file = mediaInput.files[0];
    if (file) {
      fileNameDisplay.textContent = file.name;
      fileNameDisplay.classList.add('file-name');
      btnRemoveFile.style.display = 'block';
    } else {
      resetFileInput();
    }
  });

  btnRemoveFile.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    resetFileInput();
  });

  vaultForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hint.textContent = '';

    const titulo   = tituloEl.value.trim();
    const conteudo = conteudoEl.value.trim();

    if (!titulo || !conteudo){
      hint.textContent = 'Preencha o título e o conteúdo antes de selar.';
      return;
    }

    const originalText = btnSalvar.innerHTML;
    btnSalvar.disabled = true;
    btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando e Selando…';

    try {
      let mediaBlob = null;
      let mediaType = null;

      if (mediaInput.files.length > 0){
        const file = mediaInput.files[0];
        mediaType = file.type || 'application/octet-stream';
        const buffer = await lerArquivo(file);
        mediaBlob = new Blob([buffer], { type: mediaType });
      }

      const entry = {
        id: Date.now(),
        titulo,
        conteudo,
        mediaBlob,
        mediaType,
        createdAt: new Date().toISOString()
      };

      await saveEntry(entry);
      vaultForm.reset();
      resetFileInput();
      showToast('Entrada salva e criptografada localmente.');
      await carregar();
    } catch (err) {
      console.error(err);
      hint.textContent = 'Falha ao salvar entrada: ' + (err.message || 'Erro desconhecido.');
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.innerHTML = originalText;
    }
  });

  // Delegar Ações nos Cards
  listaPrompts.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = parseInt(btn.dataset.id, 10);
    if (!id) return;

    if (btn.classList.contains('btn-delete')){
      if (!confirm('Tem certeza de que deseja remover permanentemente esta entrada do cofre?')) return;
      try {
        await deleteEntry(id);
        showToast('Entrada removida com sucesso.', 'fa-trash-can');
        await carregar();
      } catch (err) {
        showToast('Erro ao remover entrada.', 'fa-triangle-exclamation');
      }
    } else if (btn.classList.contains('btn-copy')){
      const texto = btn.dataset.texto || '';
      try {
        await navigator.clipboard.writeText(texto);
        const originalContent = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiado!';
        showToast('Prompt copiado para a área de transferência.');
        setTimeout(() => btn.innerHTML = originalContent, 1600);
      } catch (err) {
        showToast('Erro ao copiar automaticamente.', 'fa-triangle-exclamation');
      }
    }
  });

  // Busca em tempo real
  searchInput.addEventListener('input', () => {
    const term = searchInput.value.toLowerCase().trim();
    if (!term) {
      renderizar(entriesCache);
      return;
    }
    const filtered = entriesCache.filter(item => 
      item.titulo.toLowerCase().includes(term) || 
      item.conteudo.toLowerCase().includes(term)
    );
    renderizar(filtered, true);
  });

  /* ---------- Renderização ---------- */
  let _mediaURLs = [];

  function renderizar(entries, isSearching = false){
    entryCount.textContent = `${String(entriesCache.length).padStart(3, '0')} Entradas`;

    // Revogar URLs antigas da memória
    _mediaURLs.forEach(url => URL.revokeObjectURL(url));
    _mediaURLs = [];

    if (entries.length === 0){
      listaPrompts.innerHTML = `
        <div class="state-msg">
          <i class="fa-solid ${isSearching ? 'fa-magnifying-glass' : 'fa-vault'}"></i>
          ${isSearching ? 'Nenhum resultado encontrado para a busca.' : 'O cofre está totalmente vazio.'}
          <div class="sub">${isSearching ? 'Tente buscar com outros termos.' : 'Crie sua primeira entrada utilizando o formulário acima.'}</div>
        </div>`;
      return;
    }

    listaPrompts.innerHTML = entries.map((p, i) => {
      const numero = String(entriesCache.length - entriesCache.findIndex(e => e.id === p.id)).padStart(3, '0');
      let mediaHTML = '';

      if (p.mediaBlob) {
        const url = URL.createObjectURL(p.mediaBlob);
        _mediaURLs.push(url);
        const isVideo = (p.mediaType || '').startsWith('video/');
        
        mediaHTML = `
          <div class="media-wrapper">
            ${isVideo 
              ? `<video src="${url}" class="media-preview" controls preload="metadata"></video>`
              : `<img src="${url}" class="media-preview" alt="Anexo de ${escapeAttr(p.titulo)}" loading="lazy">`
            }
          </div>`;
      }

      return `
        <article class="prompt-card">
          <div class="card-header">
            <h3 class="card-title">${escapeHtml(p.titulo)}</h3>
            <span class="ledger-no">N&deg; ${numero}</span>
          </div>
          <div class="card-body">${escapeHtml(p.conteudo)}</div>
          ${mediaHTML}
          <div class="card-actions">
            <button class="btn-copy" data-id="${p.id}" data-texto="${escapeAttr(p.conteudo)}" aria-label="Copiar prompt">
              <i class="fa-solid fa-copy"></i> Copiar Prompt
            </button>
            <button class="btn-delete" data-id="${p.id}" aria-label="Excluir entrada">
              <i class="fa-solid fa-trash-can"></i> Excluir
            </button>
          </div>
        </article>`;
    }).join('');
  }

  async function carregar(){
    try {
      entriesCache = await loadEntries();
      const searchTerm = searchInput.value.toLowerCase().trim();
      if (searchTerm) {
        const filtered = entriesCache.filter(item => 
          item.titulo.toLowerCase().includes(searchTerm) || 
          item.conteudo.toLowerCase().includes(searchTerm)
        );
        renderizar(filtered, true);
      } else {
        renderizar(entriesCache);
      }
    } catch (err) {
      console.error(err);
      listaPrompts.innerHTML = `
        <div class="state-msg">
          <i class="fa-solid fa-triangle-exclamation"></i>
          Não foi possível carregar os dados do cofre.
          <div class="sub">Verifique se o seu navegador permite armazenamento local de dados.</div>
        </div>`;
    }
  }

  // Inicialização
  carregar();
</script>
</body>
</html>
